services:
  # ------------------------------
  # Etcd：元数据存储（稳定）
  # ------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: milvus-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus-data/etcd:/etcd-data
    command: etcd --name=etcd-1 --data-dir=/etcd-data --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://etcd:2379 --listen-peer-urls=http://0.0.0.0:2380 --initial-advertise-peer-urls=http://etcd:2380 --initial-cluster=etcd-1=http://etcd:2380
    networks:
      - milvus-network

  # ------------------------------
  # MinIO：向量存储（已修复）
  # ------------------------------
  minio:
    image: minio/minio:RELEASE.2023-08-04T17-40-21Z
    container_name: milvus-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./milvus-data/minio:/data
    command: server /data
    networks:
      - milvus-network

  # ------------------------------
  # Milvus 核心服务（修复 Tini 命令问题）
  # ------------------------------
  milvus-standalone:
    image: milvusdb/milvus:v2.4.8
    container_name: milvus-standalone
    restart: always
    depends_on:
      - etcd
      - minio
    environment:
      - MILVUS_LOG_LEVEL=info
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - GOMAXPROCS=4
      - MEMORY_LIMIT=4GB
    volumes:
      - ./milvus-data/milvus:/var/lib/milvus
    # 关键：直接指定 Milvus 启动二进制文件，绕开 Tini 解析
    command: /milvus/bin/milvus run standalone
    networks:
      - milvus-network
    ports:
      - "19530:19530"  # 客户端连接端口
      - "9091:9091"    # HTTP 监控端口

  # ------------------------------
  # Attu：可视化管理界面（确保连接）
  # ------------------------------
  attu:
    image: zilliz/attu:v2.4.5
    container_name: milvus-attu
    restart: always
    depends_on:
      - milvus-standalone
    environment:
      - MILVUS_URL=milvus-standalone:19530  # 同网络服务名直接访问
    networks:
      - milvus-network
    ports:
      - "8000:3000"

# ------------------------------
# 统一网络：确保所有服务互通
# ------------------------------
networks:
  milvus-network:
    driver: bridge