services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: milvus-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus-data/etcd:/etcd-data
    command: >
      etcd --name=etcd-1
      --data-dir=/etcd-data
      --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-advertise-peer-urls=http://etcd:2380
      --initial-cluster=etcd-1=http://etcd:2380
    networks:
      - milvus-network

  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: milvus-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./milvus-data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - milvus-network

  milvus-standalone:
    image: milvusdb/milvus:v2.4.8
    container_name: milvus-standalone
    restart: always
    depends_on:
      - etcd
      - minio
    environment:
      - MILVUS_LOG_LEVEL=info
      - MILVUS_NETWORK_ADDRESS=milvus-standalone
      - MILVUS_NETWORK_PORT=19530
      - MILVUS_HTTP_PORT=9091
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - GOMAXPROCS=4
      - MEMORY_LIMIT=4GB
    volumes:
      - ./milvus-data/milvus:/var/lib/milvus
    networks:
      - milvus-network
    ports:
      - "19530:19530"
      - "9091:9091"

  # Milvus 可视化管理工具
  attu:
    image: zilliz/attu:v2.4.5
    container_name: milvus-attu
    restart: always
    depends_on:
      - milvus-standalone
    environment:
      # 连接到Milvus服务
      - MILVUS_URL=milvus-standalone:19530
    networks:
      - milvus-network
    ports:
      - "8000:3000"  # 本地8000端口映射到容器的3000端口

networks:
  milvus-network:
    driver: bridge
